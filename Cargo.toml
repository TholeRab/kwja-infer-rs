[workspace]
resolver = "2"
members = ["crates/*", "cli", "."]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ndarray = "0.17"
rayon = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "api-23",
    "cuda",
    "load-dynamic",
] }

[package]
name = "kwja-gates"
version.workspace = true
edition.workspace = true

[dev-dependencies]
kwja-encoder = { path = "crates/encoder" }
kwja-pipeline = { path = "crates/pipeline" }
kwja-heads = { path = "crates/heads" }
