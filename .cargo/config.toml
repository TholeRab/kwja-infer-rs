# ORT 素材在**本仓内** assets/ort/（ 起不再引用 参考实现仓）。
# 版本：onnxruntime-gpu 1.23.2；来源见 assets/ort/SOURCE.md。
#
# 运行时走 load-dynamic（ort feature），不靠链接期导入，所以这里只需要指 DLL 目录；
# 实际加载由 crates/encoder/src/ort_backend/session.rs 的 ort_dll_path() 显式指路。
[env]
ORT_LIB_PATH = { value = "assets/ort/onnxruntime/capi", relative = true }
